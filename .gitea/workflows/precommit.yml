# Prepare the workspace once, persist it, then run each Make gate as
# its own job against that tree. Check jobs do not needs one another.
# Not a combined make check / pre-commit job.
#
# Empty runner images: the prepare-stage job clones GITHUB_SHA with the
# job token over HTTPS (Gitea git HTTP returns 401 without the token) and
# installs shared tools. Check jobs restore that tree via the Gitea
# artifact HTTP API. Do not git init, set init.defaultBranch, or use
# actions/checkout.
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare-stage:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates make gcc libc6-dev libpq-dev curl
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: cpanm --notest --local-lib=local --installdeps --with-develop .
      - run: |
          mkdir -p local/bin
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C local/bin gitleaks
          chmod +x local/bin/gitleaks
          local/bin/gitleaks version
      - run: perl scripts/ci-prepared-tree.pl upload

  test:
    needs: [prepare-stage]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for restore" >&2; exit 1; fi
          base="${GITHUB_SERVER_URL%/}"
          if ! curl -fsSL -H "Authorization: token ${token}" \
            "${base}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-prepared-tree.pl?ref=${GITHUB_SHA}" \
            -o /tmp/ci-prepared-tree.pl; then
            host="${GITHUB_SERVER_URL#https://}"
            host="${host#http://}"
            curl -fsSL "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-prepared-tree.pl" \
              -o /tmp/ci-prepared-tree.pl
          fi
          perl /tmp/ci-prepared-tree.pl restore
      - run: make test

  perlcritic:
    needs: [prepare-stage]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for restore" >&2; exit 1; fi
          base="${GITHUB_SERVER_URL%/}"
          if ! curl -fsSL -H "Authorization: token ${token}" \
            "${base}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-prepared-tree.pl?ref=${GITHUB_SHA}" \
            -o /tmp/ci-prepared-tree.pl; then
            host="${GITHUB_SERVER_URL#https://}"
            host="${host#http://}"
            curl -fsSL "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-prepared-tree.pl" \
              -o /tmp/ci-prepared-tree.pl
          fi
          perl /tmp/ci-prepared-tree.pl restore
      - run: make perlcritic

  cpan-audit:
    needs: [prepare-stage]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for restore" >&2; exit 1; fi
          base="${GITHUB_SERVER_URL%/}"
          if ! curl -fsSL -H "Authorization: token ${token}" \
            "${base}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-prepared-tree.pl?ref=${GITHUB_SHA}" \
            -o /tmp/ci-prepared-tree.pl; then
            host="${GITHUB_SERVER_URL#https://}"
            host="${host#http://}"
            curl -fsSL "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-prepared-tree.pl" \
              -o /tmp/ci-prepared-tree.pl
          fi
          perl /tmp/ci-prepared-tree.pl restore
      - run: make audit

  gitleaks:
    needs: [prepare-stage]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for restore" >&2; exit 1; fi
          base="${GITHUB_SERVER_URL%/}"
          if ! curl -fsSL -H "Authorization: token ${token}" \
            "${base}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-prepared-tree.pl?ref=${GITHUB_SHA}" \
            -o /tmp/ci-prepared-tree.pl; then
            host="${GITHUB_SERVER_URL#https://}"
            host="${host#http://}"
            curl -fsSL "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-prepared-tree.pl" \
              -o /tmp/ci-prepared-tree.pl
          fi
          perl /tmp/ci-prepared-tree.pl restore
      - run: make gitleaks

  perltidy:
    needs: [prepare-stage]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for restore" >&2; exit 1; fi
          base="${GITHUB_SERVER_URL%/}"
          if ! curl -fsSL -H "Authorization: token ${token}" \
            "${base}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-prepared-tree.pl?ref=${GITHUB_SHA}" \
            -o /tmp/ci-prepared-tree.pl; then
            host="${GITHUB_SERVER_URL#https://}"
            host="${host#http://}"
            curl -fsSL "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-prepared-tree.pl" \
              -o /tmp/ci-prepared-tree.pl
          fi
          perl /tmp/ci-prepared-tree.pl restore
      - run: make perltidy
